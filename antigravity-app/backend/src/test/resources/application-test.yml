# 테스트 프로파일 — 인메모리 H2 (PostgreSQL 없이 단위/슬라이스 테스트)
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop       # 테스트는 매번 새 스키마
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false                # 테스트에선 Flyway 끄고 ddl-auto 사용
  data:
    redis:
      host: localhost
      port: 6379
